<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Festival Operations Engine</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f2f5fa,#090e1b);--panel:light-dark(#fff,#111a2e);--ink:light-dark(#0f1a33,#eef2fb);--muted:light-dark(#5d6c8d,#93a3c4);--line:light-dark(#e1e7f1,#243250);--accent:#6a5cf0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
.card{width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px #0002}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:800;color:var(--muted)}
h1{font-size:22px;margin:4px 0 4px}p{color:var(--muted);margin:0 0 18px;font-size:13px}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:0}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:10px;background:linear-gradient(135deg,#7a6bff,#5b78f2);color:#fff;font:inherit;font-weight:700;cursor:pointer}
#err{color:#e5484d;font-size:12.5px;min-height:18px;margin-top:10px}
</style></head><body>
<form class="card" id="f">
  <div class="eyebrow">Short Circuits · Official access</div>
  <h1>Festival Operations Engine</h1>
  <p>Sign in to view the live corridor plan.</p>
  <label for="u">Username</label><input id="u" autocomplete="username" required autofocus>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
  <button>Sign in</button><div id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="";
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});
  if(r.ok)location.href="/";else err.textContent=(await r.json()).error||"Sign-in failed."};
</script></body></html>
